<svg xmlns="http://www.w3.org/2000/svg" width="560" height="521.1" viewBox="0 0 560 521.1"><rect width="560" height="521.1" fill="#E9EEF5"/><rect x="310" y="30" width="220" height="49.3" rx="18" fill="#FFB627"/><text x="328" y="67.0" font-family="'Roboto','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#0F2340" text-anchor="start" >Алёша</text><rect x="30" y="97.3" width="380" height="49.3" rx="18" fill="#1C3A63"/><text x="48" y="134.3" font-family="'Roboto','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="500" fill="#FFF4DC" text-anchor="start" >Чего изволите, Иван Петрович?</text><rect x="310" y="164.6" width="220" height="49.3" rx="18" fill="#FFB627"/><text x="328" y="201.6" font-family="'Roboto','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#0F2340" text-anchor="start" >Позвони дочке</text><rect x="30" y="231.89999999999998" width="380" height="76.6" rx="18" fill="#1C3A63"/><text x="48" y="268.9" font-family="'Roboto','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="500" fill="#FFF4DC" text-anchor="start" >Позвонить: Дочь?</text><text x="48" y="296.2" font-family="'Roboto','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="500" fill="#FFF4DC" text-anchor="start" >Скажите да или нет.</text><rect x="310" y="326.5" width="220" height="49.3" rx="18" fill="#FFB627"/><text x="328" y="363.5" font-family="'Roboto','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" fill="#0F2340" text-anchor="start" >Да</text><rect x="30" y="393.8" width="380" height="49.3" rx="18" fill="#1C3A63"/><text x="48" y="430.8" font-family="'Roboto','Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="500" fill="#FFF4DC" text-anchor="start" >Звоню: Дочь</text><text x="280" y="491.1" font-family="'Roboto','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="700" fill="#0F2340" text-anchor="middle" >«дочь», «дочке», «дочери», «доча» — один контакт</text></svg>