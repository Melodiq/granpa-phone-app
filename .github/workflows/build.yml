name: Сборка APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Кэш моделей распознавания
        id: model-cache
        uses: actions/cache@v4
        with:
          path: models
          key: vosk-models-ru022-en015-cn022

      - name: Скачать модели Vosk (русский, английский, китайский — офлайн)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p models && cd models
          for m in vosk-model-small-ru-0.22 vosk-model-small-en-us-0.15 vosk-model-small-cn-0.22; do
            curl -sSL -o "$m.zip" "https://alphacephei.com/vosk/models/$m.zip"
            unzip -q "$m.zip"
            rm "$m.zip"
          done
          mv vosk-model-small-ru-0.22 model-ru
          mv vosk-model-small-en-us-0.15 model-en
          mv vosk-model-small-cn-0.22 model-zh

      - name: Положить модели в assets
        run: |
          mkdir -p app/src/main/assets
          for l in ru en zh; do
            cp -r "models/model-$l" "app/src/main/assets/model-$l"
          done
          echo "small-ru-0.22" > app/src/main/assets/model-ru/uuid
          echo "small-en-us-0.15" > app/src/main/assets/model-en/uuid
          echo "small-cn-0.22" > app/src/main/assets/model-zh/uuid

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Сборка
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/release/app-release.apk granpa-phone.apk

      - uses: actions/upload-artifact@v4
        with:
          name: granpa-phone-apk
          path: granpa-phone.apk

      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Версия ${{ github.run_number }}
          files: granpa-phone.apk
          make_latest: true
